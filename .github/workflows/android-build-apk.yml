name: Build Signed Android Release APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Package Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          add-job-summary: 'on-failure'
          add-job-summary-as-pr-comment: 'never'

      - name: Prepare Environment Files & Gradle Wrapper
        run: |
          # Crear archivos de entorno vacíos locales requeridos por Secrets Gradle Plugin
          touch .env && touch .env.example

          # Asegurar que gradlew exista y tenga permisos de ejecución
          if [ ! -f "gradlew" ]; then
            echo "gradlew no encontrado, generando wrapper..."
            gradle wrapper || true
          fi
          chmod +x gradlew || true

      - name: Configure Keystore and Signing Environment
        run: |
          # Si no existe un keystore previo, generar uno automáticamente con alias y clave estándar
          if [ ! -f "my-upload-key.jks" ] && [ ! -f "app/my-upload-key.jks" ]; then
            echo "Generando keystore de firma release..."
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Moodgram, OU=Mobile, O=Moodgram, L=Havana, ST=Havana, C=CU"
          fi

          # Garantizar copia redundante en la raíz del espacio de trabajo y dentro de app/
          if [ -f "my-upload-key.jks" ]; then
            mkdir -p app
            cp my-upload-key.jks app/my-upload-key.jks || true
          elif [ -f "app/my-upload-key.jks" ]; then
            cp app/my-upload-key.jks my-upload-key.jks || true
          fi

          # Inspeccionar dinámicamente con keytool el alias para prevenir discrepancias
          DETECTED_ALIAS=$(keytool -list -v -keystore my-upload-key.jks -storepass "${STORE_PASSWORD:-android}" 2>/dev/null | grep -i "Alias name:" | head -n 1 | awk -F': ' '{print $2}' | tr -d ' \r\n')
          if [ -z "$DETECTED_ALIAS" ]; then
            DETECTED_ALIAS="upload"
          fi
          echo "Alias detectado en el keystore: $DETECTED_ALIAS"

          # Exportar variables de entorno para Gradle
          echo "KEY_ALIAS=$DETECTED_ALIAS" >> $GITHUB_ENV
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> $GITHUB_ENV
          echo "STORE_PASSWORD=${STORE_PASSWORD:-android}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${KEY_PASSWORD:-android}" >> $GITHUB_ENV

      - name: Build Release APK
        run: |
          ./gradlew :app:assembleRelease --no-daemon -Dkotlin.compiler.execution.strategy=daemon -Dksp.incremental=false -Dksp.incremental.intermodule=false --stacktrace

      - name: Verify APK Output
        run: |
          echo "Archivos APK generados:"
          ls -la app/build/outputs/apk/release/
          APK_COUNT=$(find app/build/outputs/apk/release -name "*.apk" | wc -l)
          if [ "$APK_COUNT" -eq 0 ]; then
            echo "Error: No se encontró ningún APK generado en app/build/outputs/apk/release/"
            exit 1
          fi
          echo "APK verificado y listo para distribución."

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
